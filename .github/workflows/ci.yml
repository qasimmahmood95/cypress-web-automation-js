name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: the suite targets a live third-party site, so run it
    # even when the repo is quiet to catch the site changing underneath us.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The lint job never launches a browser, so skip the binary download.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  e2e:
    name: Cypress E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report-${{ matrix.browser }}
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/screenshots
          if-no-files-found: ignore

  publish-report:
    name: Publish HTML report
    runs-on: ubuntu-latest
    needs: e2e
    # Publish the latest Chrome report from main — even for failed runs,
    # since a browsable failure report is exactly when you want one.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - name: Download Chrome report
        uses: actions/download-artifact@v4
        with:
          name: cypress-report-chrome
          path: report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report
          force_orphan: true
