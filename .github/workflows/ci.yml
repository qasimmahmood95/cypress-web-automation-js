name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary: the suite targets a live third-party site, so run it
    # even when the repo is quiet to catch the site changing underneath us.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The lint job never launches a browser, so skip the binary download.
          CYPRESS_INSTALL_BINARY: '0'

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  e2e:
    name: Cypress E2E (Chrome)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
